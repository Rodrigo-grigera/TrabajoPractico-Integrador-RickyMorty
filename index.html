<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabajo Practico</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Rick y Morty</h1>

      <div class="filtros">
        <div class="filtro-estado">
          <label>Filtrar Personajes</label>

          <div>
            <select id="filterEstado">
              <option value="">Todos</option>
              <option value="alive">Vivos</option>
              <option value="dead">Muertos</option>
              <option value="unknown">Desconocidos</option>
            </select>

            <button id="reset">Reset</button>
          </div>
        </div>

        <div class="buscar-nombre">
          <label for="input">Buscar por nombre</label>

          <div>
            <input id="input" type="text" placeholder="Ingresar nombre" />
            <button id="buscar">Buscar</button>
          </div>
        </div>
      </div>
    </header>
    
    <main>
      <article class="cont-tarjeta">
        <button id="back" disabled>Anterior</button>

        <div id="tarjeta"></div>

        <button id="next">Siguiente</button>
      </article>
    </main>

    <dialog id="modal">
      <button id="cerrar">X</button>
      <div id="modal-body"></div>
    </dialog>

    <footer>© 2026 Api Rick and Morty · All rights reserved.</footer>

    <script src="index.js"></script>
  </body>
</html>
